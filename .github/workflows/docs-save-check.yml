name: Documentation and save evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Public portable checks: no private ROM, local Ches tools or compiler installation.
      - name: Run portable source, documentation, and save checks
        run: make ci
